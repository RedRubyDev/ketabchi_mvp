version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ketabchi
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ketabchi_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://ketabchi:password@postgres:5432/ketabchi_db?schema=public
    depends_on:
      - postgres

volumes:
  pgdata:
